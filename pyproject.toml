[project]
name = "portal-agent-cloud"
version = "0.1.0"
description = "Launch Cursor Cloud Agents for Jimmy portal implementations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.3.0",
    "typer>=0.25.1",
]

[project.scripts]
portal-cloud-agent = "portal_agent_cloud.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
